[package]
name = "budget-context"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Hierarchical resource budgets for concurrent Rust task trees"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/budget-context"
homepage = "https://github.com/akosidencio/budget-context"
repository = "https://github.com/akosidencio/budget-context"
readme = "README.md"
keywords = ["budget", "resource", "async", "agents", "quota"]
categories = ["asynchronous", "concurrency"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]
tokio = ["dep:tokio", "dep:tokio-util"]
tracing = ["dep:tracing"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.7"
loom = "0.7"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3"

[[bench]]
name = "accounting"
harness = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
